<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Page introuvable · Darlia</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#FCFBF8">
<link rel="preload" href="/assets/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* police hébergée sur le site (plus rapide, et aucune adresse IP transmise à Google) */
  @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; font-display: swap; src: url(/assets/fonts/instrument-serif-italic-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; font-display: swap; src: url(/assets/fonts/instrument-serif-italic-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* Mentions légales : la même matière que le site (papier, encre, un seul accent), en une colonne de lecture. */
  :root{
    color-scheme:light;
    --ink:#1A1A18; --ink-2:#4F4D45; --ink-3:#7F7B70;
    --line:rgba(26,26,24,.14); --accent:#2F6B4C; --paper:#FCFBF8;
    --serif:'Instrument Serif',Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    --pad:clamp(22px,5vw,56px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:var(--ink);text-decoration:underline;text-decoration-color:rgba(26,26,24,.3);text-underline-offset:3px;transition:color .2s,text-decoration-color .2s}
  a:hover{color:var(--accent);text-decoration-color:var(--accent)}

  .bar{position:sticky;top:0;z-index:2;background:rgba(252,251,248,.86);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
  .bar .in{max-width:1120px;margin:0 auto;padding:14px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:16px}
  .bar img{display:block;height:30px;width:auto}
  .bar .back{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:99px;background:var(--ink);color:#FBFBFA;text-decoration:none;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
  .bar .back:hover{color:#fff}
  .bar .back svg{width:14px;height:14px}

  main{max-width:760px;margin:0 auto;padding:clamp(56px,9vw,112px) var(--pad) clamp(64px,9vw,120px)}
  .k{margin:0;display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:620;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
  .k::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(26,26,24,.18),transparent)}
  h1{margin:22px 0 0;font-size:clamp(38px,6vw,64px);font-weight:700;line-height:1.02;letter-spacing:-.045em;text-wrap:balance}
  h1 em{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.1em;letter-spacing:-.02em;color:var(--accent)}
  .lead{margin:22px 0 0;max-width:34em;font-size:clamp(17px,1rem + .25vw,19px);color:var(--ink-2)}
  .toc{margin:36px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
  .toc a{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:99px;background:#F1EFE8;text-decoration:none;font-size:14px;font-weight:590;color:var(--ink)}
  .toc a:hover{background:#E8EFEA;color:var(--accent)}

  section{margin-top:clamp(56px,7vw,80px);padding-top:clamp(28px,3.4vw,36px);border-top:1px solid var(--line);scroll-margin-top:84px}
  h2{margin:0;font-size:clamp(24px,2.6vw,30px);font-weight:700;letter-spacing:-.035em;line-height:1.1}
  h3{margin:30px 0 0;font-size:17px;font-weight:650;letter-spacing:-.015em}
  section p,section li{color:var(--ink-2)}
  section p{margin:12px 0 0}
  section ul{margin:12px 0 0;padding-left:1.1em}
  section li{margin-top:6px}
  section li::marker{color:var(--accent)}
  b,strong{color:var(--ink);font-weight:620}

  /* la fiche : libellé à gauche, valeur à droite */
  dl{margin:22px 0 0;display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr);border-top:1px solid var(--line)}
  dt,dd{margin:0;padding:13px 0;border-bottom:1px solid var(--line)}
  dt{font-size:14.5px;font-weight:590;color:var(--ink-3);padding-right:20px}
  dd{color:var(--ink)}

  .updated{margin-top:clamp(56px,7vw,80px);font-size:14px;color:var(--ink-3)}
  footer{border-top:1px solid var(--line)}
  footer .in{max-width:1120px;margin:0 auto;padding:22px var(--pad) max(28px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-size:13.5px;color:var(--ink-3)}
  footer a{color:var(--ink-3)}

  @media (max-width:620px){
    body{font-size:16px}
    dl{grid-template-columns:minmax(0,1fr)}
    dt{padding:14px 0 0;border-bottom:0}
    dd{padding:2px 0 14px}
    .bar img{height:26px}
    .bar .back{height:36px;padding:0 14px;font-size:14px}
    footer .in{flex-direction:column}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="in">
    <a href="/" aria-label="Darlia, retour à l’accueil"><img src="/assets/logo-darlia.png?v=2" alt="Darlia" width="939" height="288"></a>
    <a class="back" href="/"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Retour au site</a>
  </div>
</header>

<main style="min-height:60vh">
  <p class="k">Erreur 404</p>
  <h1>Cette page <em>n’existe pas.</em></h1>
  <p class="lead">Le lien est peut-être ancien, ou l’adresse contient une faute de frappe.</p>
  <p style="margin-top:34px"><a class="back" href="/" style="display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:99px;background:#1A1A18;color:#FBFBFA;text-decoration:none;font-weight:600">Revenir à l’accueil</a></p>
</main>
</body>
</html>
