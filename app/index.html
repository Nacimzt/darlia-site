      {t:'Suspendre l’automatisation', run:()=>toast('Automatisation suspendue sur ce dossier')},
      {sep:true},
      {t:'Clôturer l’intervention', run:()=>toast('Intervention clôturée')},
    ];
  }
  const el = document.createElement('div');
  el.className = 'ctx' + (kind==='user' ? ' ctx-user' : '');
  const head = kind==='user' ? `<div class="cxu">
      <span class="avatar av-img"><img src="${AVATAR_SM}" alt=""></span>
      <span class="cxu-b"><b>Sophie Martin</b><span>Administratrice · Agence Rivoli Gestion</span></span>
      <span class="udot"></span>
    </div><hr>` : '';
  const foot = kind==='user' ? `<hr><div class="cxf"><span class="pulse"></span>Darlia fonctionne normalement</div>` : '';
  el.innerHTML = head + items.map((it,i)=> it.sep ? '<hr>' :
    `<button data-ctxi="${i}" ${it.off?'disabled':''}>${it.t}${it.k?`<span class="sub">${it.k}</span>`:''}</button>`).join('') + foot;
  $('#win').appendChild(el);
  const r = $('#win').getBoundingClientRect();
  el.style.left = Math.min(x - r.left, r.width - el.offsetWidth - 8) + 'px';
  el.style.top  = Math.min(y - r.top,  r.height - el.offsetHeight - 8) + 'px';
  el.addEventListener('click', e=>{
    const b = e.target.closest('[data-ctxi]'); if(!b) return;
    const it = items[+b.dataset.ctxi]; closeCtx(); it.run && it.run();
  });
  ctxEl = el;
}

/* ══════════════════════════════════════════════════════════════
   Événements
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click', e=>{
  const t = e.target;
  closeCtx();

  const winBtn = t.closest('[data-win]');
  if(winBtn){
    const a = winBtn.dataset.win;
    if(a==='zoom') document.body.classList.toggle('zoomed');
    if(a==='min'){ document.body.classList.add('minimized'); setTimeout(()=>document.body.classList.remove('minimized'), 1100); }
    if(a==='close') sleepMode();
    return;
  }

  const nav = t.closest('[data-view]');
  if(nav){ go(nav.dataset.view); return; }

  const back = t.closest('[data-back]');
  if(back){ go(state.view); return; }

  const f = t.closest('[data-folder]');
  if(f){ state.folder = f.dataset.folder; const first = folderMsgs(state.folder)[0]; state.msgId = first ? first.id : null; render(); return; }

  const msg = t.closest('[data-msg]');
  if(msg){ const m = findMsg(msg.dataset.msg); m.unread = false; state.msgId = m.id; render(); return; }

  const kase = t.closest('[data-case]');
  if(kase){ go('maintenance', {caseId:kase.dataset.case}); return; }

  const au = t.closest('[data-auto]');
  if(au){ go('processus', {autoId:au.dataset.auto}); return; }

  const tn = t.closest('[data-tenant]');
  if(tn){ go('contacts', {tenantId:tn.dataset.tenant}); return; }

  const ow = t.closest('[data-owner]');
  if(ow){ go('contacts', {ownerId:ow.dataset.owner}); return; }

  const vd = t.closest('[data-vendor]');
  if(vd){ go('contacts', {vendorId:vd.dataset.vendor}); return; }

  const ct = t.closest('[data-ctab]');
  if(ct){ state.contactTab = ct.dataset.ctab; state.q=''; state.contactSel=null; render(); return; }

  const cs = t.closest('[data-csel]');
  if(cs){ state.contactSel = cs.dataset.csel; render(); return; }

  const bs = t.closest('[data-bsel]');
  if(bs){ state.bienSel = bs.dataset.bsel; render(); return; }

  const bf = t.closest('[data-bfilter]');
  if(bf){ state.bienFilter = bf.dataset.bfilter; render(); return; }

  const bn = t.closest('[data-bien]');
  if(bn){ go('biens', {bienId:bn.dataset.bien}); return; }

  const lbn = t.closest('[data-lbnav]');
  if(lbn){ lbStep(+lbn.dataset.lbnav); return; }

  const lbb = t.closest('[data-lb]');
  if(lbb){ const [pid, i] = lbb.dataset.lb.split(':'); openLightbox(pid, +i); return; }
  if(t.id==='lbscrim' || t.closest('#lb')){ closeLb(); return; }

  const gobtn = t.closest('[data-go]');
  if(gobtn){
    const [kind, id] = JSON.parse(gobtn.dataset.go);
    if(kind==='case') go('maintenance',{caseId:id});
    else if(kind==='approval') openApproval(id);
    else go(id);
    return;
  }

  const dc = t.closest('[data-decide]');
  if(dc){
    const c = findCase(dc.dataset.decide); if(!c) return;
    c.status = 'Intervention planifiée'; c.pip='sage'; c.stage = 6;
    c.next = 'Confirmer au locataire la veille de l’intervention';
    c.steps.push({t:'à l’instant', title:'Accord reçu — Darlia reprend le processus',
      sub:'Menuiserie Faubourg missionnée', why:'Votre décision lève le point d’arrêt : Darlia poursuit seule jusqu’à la clôture.', state:'done'});
    render(); toast('Approuvé — Darlia a repris le processus');
    return;
  }

  const rf = t.closest('[data-refuse]');
  if(rf){
    if(t.closest('[data-sheet-close]')) closeSheet();
    const id = rf.dataset.refuse, card = rf.closest('.dk');
    if(card && !card.classList.contains('gone')) collapseCard(card, ()=>refuse(id));
    else refuse(id);
    return;
  }

  const av = t.closest('[data-approval]');
  if(av){ openApproval(av.dataset.approval); return; }

  const lv = t.closest('[data-live]');
  if(lv){ lv.dataset.live==='start' ? startLive() : stopLive(); return; }
  if(t.closest('[data-resetdemo]')){ resetDemo(); return; }

  const wh = t.closest('[data-when]');
  if(wh){ [...wh.parentNode.children].forEach(b=>b.classList.remove('on')); wh.classList.add('on'); return; }
  if(t.closest('[data-newtask]')){
    const title = ($('#ntTitle').value||'').trim();
    if(!title){ $('#ntTitle').focus(); toast('Donnez un intitulé à la tâche'); return; }
    const when = ($('#ntWhen .on')||{dataset:{when:'Aujourd’hui'}}).dataset.when;
    state.tasks.unshift({id:'k'+Date.now(), t:title, s:($('#ntSub').value||'').trim()||'Créée par Sophie Martin', when, done:false, prio:''});
    closeSheet(); go('taches'); toast('Tâche créée');
    return;
  }

  const ed = t.closest('[data-edit]');
  if(ed){
    if(t.closest('[data-sheet-close]')) closeSheet();
    const id = ed.dataset.edit;
    state.editing = id;
    go('inbox', {msgId:id, folder:'f-in'});
    const ta = $('#editor'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }
  const sv = t.closest('[data-save]');
  if(sv){
    const ta = $('#editor');
    if(ta) state.edits[sv.dataset.save] = ta.value;
    state.editing = null; render();
    toast('Réponse enregistrée — elle partira telle que vous l’avez écrite');
    return;
  }
  if(t.closest('[data-canceledit]')){ state.editing = null; render(); return; }
  const re = t.closest('[data-reset-edit]');
  if(re){ delete state.edits[re.dataset.resetEdit]; state.editing = null; render(); toast('Texte de Darlia rétabli'); return; }

  const cr = t.closest('[data-courrier]');
  if(cr){
    const id = cr.dataset.courrier;
    state.courrier = id;
    if(state.view!=='inbox') go('inbox', {msgId:id, folder:'f-esc'});
    else { state.msgId = id; render(); }
    return;
  }
  const sl = t.closest('[data-sendletter]');
  if(sl){
    const id = sl.dataset.sendletter, m = findMsg(id);
    state.approved[id] = true; state.editing = null;
    render();
    logActivity('send','Courrier envoyé', `${m.from} · signé Sophie Martin`);
    toast(`Courrier envoyé à ${m.from} — en votre nom`,
      {label:'Annuler', run:()=>{ delete state.approved[id]; render(); toast('Envoi annulé'); }});
    return;
  }
  const elt = t.closest('[data-editletter]');
  if(elt){
    state.editing = elt.dataset.editletter; render();
    const ta = $('#editor'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }
  const ap = t.closest('[data-approve]');
  if(ap){
    if(t.closest('[data-sheet-close]')) closeSheet();
    const id = ap.dataset.approve, card = ap.closest('.dk');
    if(card && !card.classList.contains('gone')){
      ap.textContent = 'Approuvé'; ap.classList.remove('key'); ap.classList.add('ok');
      collapseCard(card, ()=>approve(id, 'Darlia reprend le traitement.'));
    } else approve(id);
    return;
  }

  const task = t.closest('[data-task]');
  if(task){
    const k = state.tasks.find(x=>x.id===task.dataset.task);
    const card = task.closest('.dk');
    const fin = ()=>{ k.done = !k.done; render(); toast(k.done ? 'Tâche terminée — Darlia reprend le traitement.' : 'Tâche rouverte'); };
    if(card && !k.done && !card.classList.contains('gone')) collapseCard(card, fin); else fin();
    return;
  }

  const ta = t.closest('[data-toggleauto]');
  if(ta){ const a = findAuto(ta.dataset.toggleauto); a.on = !a.on; render(); toast(a.on?'Automatisation activée':'Automatisation suspendue'); return; }

  const tas = t.closest('[data-toggleassist]');
  if(tas){ const a = state.engines.find(x=>x.id===tas.dataset.toggleassist); a.on = !a.on; render(); toast(a.on?'Moteur réactivé — les processus qui en dépendent reprennent':'Moteur suspendu — les processus qui en dépendent s’arrêtent'); return; }

  const sw = t.closest('[data-switch]');
  if(sw){ sw.classList.toggle('on'); toast(sw.classList.contains('on')?'Option activée':'Option désactivée'); return; }

  const ctxb = t.closest('[data-ctxbtn]');
  if(ctxb){ const r = ctxb.getBoundingClientRect(); openCtx(r.left, r.bottom+4, ctxb.dataset.ctxbtn); return; }

  const pal = t.closest('[data-pal]');
  if(pal){ palIdx = +pal.dataset.pal; palRun(); return; }

  const tst = t.closest('[data-toast]');
  if(tst){ if(t.closest('[data-sheet-close]')) closeSheet(); toast(tst.dataset.toast); return; }

  if(t.closest('[data-sheet-close]')){ closeSheet(); return; }
  if(t.closest('#openpal')){ openPal(); return; }
  if(t.closest('[data-newtaskopen]')){ openNewTask(); return; }
  if(t.closest('[data-newcontactopen]')){ openNewContact(); return; }
  const dq = t.closest('[data-daliq]');
  if(dq){ askDali(dq.dataset.daliq); return; }
  if(t.closest('[data-toggleengines]')){ state.showEngines = !state.showEngines; render(); return; }
  const nck = t.closest('[data-nck]');
  if(nck){ [...nck.parentNode.children].forEach(b=>b.classList.remove('on')); nck.classList.add('on'); return; }
  if(t.closest('[data-newcontact]')){
    const name = ($('#ncName').value||'').trim();
    if(!name){ $('#ncName').focus(); toast('Donnez un nom au contact'); return; }
    const kind = ($('#ncKind .on')||{dataset:{nck:'locataires'}}).dataset.nck;
    const sub = ($('#ncSub').value||'').trim();
    const phone = ($('#ncPhone').value||'').trim() || '—';
    const nid = 'n' + Date.now();
    if(kind==='locataires'){
      TENANTS.unshift({id:nid, name, prop:sub||'À rattacher à un bien', lot:'—', since:'Août 2026',
        rent:'—', status:'À jour', phone});
      state.contactSel = 't:'+nid;
    } else if(kind==='proprietaires'){
      OWNERS.unshift({id:nid, name, props:sub||'À rattacher à un bien', lots:0, rep:'—', report:'À définir'});
      state.contactSel = 'o:'+nid;
    } else {
      VENDORS.unshift({id:nid, name, trade:sub||'Prestataire', zone:'Paris', since:'Août 2026',
        delay:'—', rate:0, jobs:0, spend:'0 €', contact:name, phone, last:[],
        contract:'Aucun contrat cadre pour l’instant', note:'Ajouté par Sophie Martin — Darlia complètera la fiche au fil des échanges.'});
      state.contactSel = 'v:'+nid;
    }
    state.contactTab = kind;
    closeSheet(); go('contacts'); toast('Contact créé — Darlia complètera la fiche au fil des échanges');
    return;
  }
  if(t.closest('#btnhelp')){ openShortcuts(); return; }
  if(t.closest('#btnbell')){ go('atraiter'); return; }
  const ub = t.closest('#userbtn');
  if(ub){
    const r = ub.getBoundingClientRect();
    openCtx(r.left, r.top, 'user:0');
    if(ctxEl) ctxEl.style.top = (r.top - $('#win').getBoundingClientRect().top - ctxEl.offsetHeight - 6) + 'px';
    return;
  }
  if(t.id==='palscrim'){ closePal(); return; }
  if(t.id==='sheetscrim'){ closeSheet(); return; }
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && e.target && e.target.id === 'daliq') askDali(e.target.value);
});

document.addEventListener('contextmenu', e=>{
  const row = e.target.closest('[data-ctx]');
  if(!row) return;
  e.preventDefault();
  openCtx(e.clientX, e.clientY, row.dataset.ctx);
});

$('#palinput').addEventListener('input', e=>{ palIdx = 0; palRender(e.target.value); });

document.addEventListener('input', e=>{
  if(e.target.matches('[data-q]')){ state.q = e.target.value; state.qFocus = true; render(); }
});

document.addEventListener('keydown', e=>{
  trapFocus(e);
  const palOpen = $('#palscrim').classList.contains('open');
  const meta = e.metaKey || e.ctrlKey;

  if(meta && e.key.toLowerCase()==='k'){ e.preventDefault(); palOpen ? closePal() : openPal(); return; }
  if(meta && e.key==='/'){ e.preventDefault(); openShortcuts(); return; }
  if(meta && e.key===','){ e.preventDefault(); closeSheet(); go('parametres'); return; }
  if(e.key==='Escape'){ if(ctxEl) return closeCtx(); if(palOpen) return closePal(); closeLb(); closeSheet(); return; }

  if(palOpen){
    if(e.key==='ArrowDown'){ e.preventDefault(); palIdx = Math.min(palIdx+1, palHits.length-1); palRender($('#palinput').value); }
    if(e.key==='ArrowUp'){ e.preventDefault(); palIdx = Math.max(palIdx-1, 0); palRender($('#palinput').value); }
    if(e.key==='Enter'){ e.preventDefault(); palRun(); }
    return;
  }

  if($('#lbscrim').classList.contains('open')){
    if(e.key==='ArrowLeft'){ e.preventDefault(); lbStep(-1); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); lbStep(1); return; }
  }

  if(meta && e.key>='1' && e.key<='9'){
    const ids = NAV.filter(n=>!n.sep).map(n=>n.id);
    const id = ids[+e.key-1];
    if(id){ e.preventDefault(); go(id); }
    return;
  }
  if(!meta && e.key==='/' && document.activeElement.tagName!=='INPUT'){
    e.preventDefault();
    const q = $('[data-q]');
    if(q){ q.focus(); q.select(); } else openPal();
  }
  if(e.key==='Escape' && document.activeElement.matches('[data-q]')){ state.q=''; render(); }
});

/* ─── barre latérale redimensionnable ─────────── */
(function(){
  const grip = $('#grip'), win = $('#win');
  let drag = false;
  grip.addEventListener('mousedown', e=>{ drag = true; e.preventDefault(); document.body.style.cursor='col-resize'; });
  window.addEventListener('mousemove', e=>{
    if(!drag) return;
    const w = Math.max(198, Math.min(320, e.clientX - win.getBoundingClientRect().left));
    win.style.setProperty('--sbw', w+'px');
  });
  window.addEventListener('mouseup', ()=>{ if(drag){ drag=false; document.body.style.cursor=''; } });
})();

/* ─── veille (bouton rouge) ───────────────────── */
function sleepMode(){
  const s = document.createElement('div');
  s.className = 'sleep';
  s.innerHTML = '<div class="empty"><b>Darlia continue de travailler en arrière-plan.</b>Cliquez pour revenir</div>';
  s.addEventListener('click', ()=>s.remove());
  $('#win').appendChild(s);
}

/* ─── démarrage ───────────────────────────────── */
render();
setInterval(agentTick, 5200);
setTimeout(()=>toast('Darlia a traité 18 demandes depuis 08:00'), 900);
</script>
