<title>Darlia</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url(../assets/fonts/inter-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url(../assets/fonts/inter-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
</style>
<style>
/* ═══════════════════════════════════════════════════════════
   DARLIA — système visuel
   Échelle d'espacement  4 · 8 · 12 · 16 · 24 · 32 · 48 · 64
   Rayons                4 (contrôles) · 6 (surfaces) · 10 (fenêtres)
   Typographie           11 · 12 · 13 · 15 · 17 · 22   ·   400 / 500 / 590
   Ombres                2 — fenêtre et calque flottant. Nulle part ailleurs.
   ═══════════════════════════════════════════════════════════ */
:root{
  /* matières */
  --ground:#FFFFFF;
  --chrome:#EFEDE9;
  --chrome-line:#E0DDD7;
  --fill:#F7F7F5;
  --fill-strong:#F1F1EF;
  --sel:#F1F1EF;
  --line:#E8E7E2;
  --line-soft:#F2F1ED;

  /* encres */
  --ink:#1A1A18;
  --ink-2:#6B6A65;
  --ink-3:#8A8983;
  --ink-4:#A9A7A0;

  /* accent — réservé à l'état actif et à la confirmation */
  --accent:#2F6B4C;
  --accent-mark:#87C7A4;
  --accent-fill:#EEF5F1;
  --accent-line:#CBE2D5;

  /* statut — teintes sourdes, jamais décoratives */
  --warn:#8A6D2F;  --warn-mark:#C0A05E;
  --alert:#8F4E38; --alert-mark:#B96B52;
  --calm:#6B7A8A;  --calm-mark:#A9B7C6;

  /* espacement */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;

  /* rayons */
  --r1:4px; --r2:6px; --r3:10px;   /* les seuls */

  /* ombres — les deux seules du produit */
  --sh-win:0 0 0 .5px rgba(26,26,24,.13), 0 22px 60px -18px rgba(26,26,24,.30);
  --sh-pop:0 0 0 .5px rgba(26,26,24,.12), 0 12px 32px -10px rgba(26,26,24,.26);

  --ease:cubic-bezier(.32,.72,0,1);
  --tint:#F7F7F5;
  --tint-warm:#F1F1EF;
  --t-fast:120ms; --t-base:150ms; --t-slow:180ms;
  --sbw:240px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:#DEDBD5; color:var(--ink);
  font-family:-apple-system,"SF Pro Text","SF Pro Display","Inter",BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  font-size:13px; line-height:1.46; letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; padding:24px; overflow:hidden;
}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:default;}
input,textarea{font:inherit;letter-spacing:inherit;color:inherit;border:0;background:none;appearance:none;-webkit-appearance:none;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--r1);}
::selection{background:var(--accent-fill);}
.num{font-variant-numeric:tabular-nums;}

/* défilement — recouvrant, à la macOS */
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:transparent transparent;}
.scroll::-webkit-scrollbar{width:11px;}
.scroll::-webkit-scrollbar-thumb{background:transparent;border-radius:99px;border:3.5px solid transparent;background-clip:content-box;}
.scroll:hover::-webkit-scrollbar-thumb{background:rgba(26,26,24,.22);background-clip:content-box;}
.scroll:hover{scrollbar-color:rgba(26,26,24,.22) transparent;}

/* ── fenêtre ────────────────────────────────────────────── */
.win{
  position:relative; width:100%; height:100%; max-width:1440px; max-height:960px;
  background:var(--ground); border-radius:var(--r3); box-shadow:var(--sh-win);
  display:grid; grid-template-columns:var(--sbw) 1fr; overflow:hidden;
  transition:transform .4s var(--ease), opacity .4s var(--ease);
  transform-origin:50% 100%;
}
body.zoomed{padding:0;} body.zoomed .win{max-width:none;max-height:none;border-radius:0;}
body.minimized .win{transform:scale(.06) translateY(560px);opacity:0;pointer-events:none;}
html.native, html.native body{height:100%;}
html.native body{padding:0;background:var(--chrome);overflow:hidden;}
html.native .win{max-width:none;max-height:none;width:100%;height:100%;border-radius:0;box-shadow:none;}
html.native .lights{visibility:hidden;pointer-events:none;}
html.native .toolbar{-webkit-app-region:drag;}
html.native .toolbar button,html.native .toolbar input{-webkit-app-region:no-drag;}
html.native .grip{display:none;}

/* ── barre latérale ─────────────────────────────────────── */
.sidebar{
  background:#FBFBFA; border-right:1px solid rgba(26,26,24,.07);
  display:flex; flex-direction:column; padding:0 10px var(--s2);
  min-width:0; min-height:0; user-select:none;
}
.lights{display:flex;gap:var(--s2);padding:14px 6px 0;height:44px;align-items:flex-start;}
.light{width:12px;height:12px;border-radius:50%;display:grid;place-items:center;}
.light svg{opacity:0;width:7px;height:7px;transition:opacity .1s;}
.lights:hover .light svg{opacity:.55;}
.l-red{background:#EC6A5F;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1);}
.l-yel{background:#F4BF50;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1);}
.l-grn{background:#61C554;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1);}

.brand{display:flex;align-items:center;gap:9px;margin:0 0 4px;padding:4px 7px 16px;
  border-bottom:1px solid rgba(26,26,24,.05);}
.brand .bn{min-width:0;}
.bchev{width:12px;height:12px;flex:none;margin-left:-3px;color:var(--ink-4);opacity:.55;}
.mark{width:34px;height:34px;border-radius:8px;background:#3A4A42;flex:none;
  display:grid;place-items:center;}
.mark svg{width:30px;height:30px;display:block;}
.brand .bn span{display:block;font-size:14px;font-weight:560;letter-spacing:-.01em;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Les intitulés de groupe ne sont qu'un repère : petits, espacés, presque muets. */
.nav{display:flex;flex-direction:column;gap:2px;min-height:0;}
.nav.grow{flex:1;overflow-y:auto;}
.nav-label{font-size:10.5px;font-weight:620;letter-spacing:.085em;text-transform:uppercase;
  color:var(--ink-3);padding:22px 9px 7px;line-height:1;}
.nav>.nav-label:first-child{padding-top:14px;}
.navi{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  height:32px;padding:0 9px;border-radius:var(--r2);
  color:var(--ink-2);font-size:14px;font-weight:500;letter-spacing:-.008em;
  transition:background .1s linear,color .1s linear;
}
.navi svg{width:16px;height:16px;flex:none;stroke:currentColor;opacity:.7;
  transition:opacity .1s linear;}
.navi:hover{background:rgba(26,26,24,.035);color:var(--ink);}
.navi:hover svg{opacity:.9;}
.navi.on{background:rgba(26,26,24,.07);color:var(--ink);font-weight:590;}
.navi.on svg{opacity:1;}
.navi .count{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  letter-spacing:0;}
.navi .count.due{color:var(--ink-2);}
.navi.on .count{color:var(--ink-2);}
.navi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.sb-foot{margin-top:auto;padding-top:var(--s2);}
/* Le filet sépare la navigation de ce qui relève de Darlia et de vous. */
.sysline{display:flex;align-items:center;gap:6px;margin-top:10px;padding:11px 9px 0;
  border-top:1px solid rgba(26,26,24,.05);
  font-size:11px;line-height:1.3;color:var(--ink-3);letter-spacing:-.002em;}
.sysline .pulse{width:4px;height:4px;flex:none;}
.sysline.warn{color:var(--warn);}
.sysline.warn .pulse{background:var(--warn-mark);}
.userbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 9px;margin-top:7px;border-radius:var(--r2);
  transition:background .1s linear;}
.userbtn:hover{background:rgba(26,26,24,.035);}
.userbtn .avatar{width:26px;height:26px;font-size:10.5px;}
.userbtn .ub{min-width:0;flex:1;}
.userbtn .ub b{display:block;font-size:12.5px;font-weight:560;letter-spacing:-.008em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.userbtn .ub span{display:block;font-size:11px;color:var(--ink-4);margin-top:1px;}
.udot{width:5px;height:5px;border-radius:50%;background:var(--accent-mark);flex:none;}
.udot.warn{background:var(--warn-mark);}

.grip{position:absolute;top:0;bottom:0;left:calc(var(--sbw) - 3px);width:6px;cursor:col-resize;z-index:40;}

/* ── barre d'outils ─────────────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--ground);}
.toolbar{
  height:52px;flex:none;display:flex;align-items:center;gap:var(--s2);
  padding:0 var(--s5) 0 var(--s6); background:rgba(255,255,255,.8); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  user-select:none; position:relative; z-index:5;
}
.tb-title{font-size:13px;font-weight:500;letter-spacing:-.008em;}
.tb-crumb{display:flex;align-items:center;gap:var(--s1);min-width:0;}
.back{display:grid;place-items:center;width:22px;height:22px;border-radius:var(--r1);color:var(--ink-3);margin-left:-4px;transition:background .1s,color .1s;}
.back:hover{background:var(--fill-strong);color:var(--ink);}
.back svg{width:15px;height:15px;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--s1);}
.iconbtn{width:26px;height:26px;border-radius:var(--r1);display:grid;place-items:center;color:var(--ink-2);transition:background .1s,color .1s;position:relative;}
.iconbtn:hover{background:var(--fill-strong);color:var(--ink);}
.iconbtn svg{width:16px;height:16px;}
.iconbtn.has-badge::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--alert-mark);box-shadow:0 0 0 2px var(--ground);}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--fill-strong);display:grid;place-items:center;font-size:11px;font-weight:590;color:var(--ink-2);letter-spacing:0;flex:none;}
.av-img{overflow:hidden;}
.av-img img{width:100%;height:100%;object-fit:cover;display:block;}
.av-xl{width:56px;height:56px;box-shadow:0 0 0 1px var(--line-soft);}
.health{display:inline-flex;align-items:center;gap:6px;margin-left:var(--s4);font-size:12px;color:var(--ink-3);}
.health i{width:6px;height:6px;border-radius:50%;background:var(--accent-mark);flex:none;}
.health.warn i{background:var(--warn-mark);}
.health.warn{color:var(--warn);}
@media (max-width:980px){.health{display:none;}}
.health{display:inline-flex;align-items:center;gap:6px;margin-left:var(--s4);font-size:12px;color:var(--ink-3);}
.health i{width:5px;height:5px;border-radius:50%;background:var(--accent-mark);flex:none;}
.health.warn i{background:var(--warn-mark);} .health.warn{color:var(--warn);}
@media (max-width:1080px){.health{display:none;}}
.live{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px 0 7px;border-radius:var(--r1);background:var(--accent-fill);color:var(--accent);font-size:11px;font-weight:500;margin-left:var(--s3);}
.live[hidden]{display:none;}
.live i{width:5px;height:5px;border-radius:50%;background:var(--accent-mark);animation:pulse 1.9s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── page ───────────────────────────────────────────────── */
.view{flex:1;min-height:0;display:flex;flex-direction:column;}
.page{flex:1;min-height:0;padding:var(--s5) var(--s7) 0;display:flex;justify-content:center;align-items:flex-start;}
.col{width:100%;max-width:720px;padding-bottom:var(--s6);} .col.wide{max-width:1000px;}

.phead{display:flex;align-items:flex-start;gap:var(--s4);padding-bottom:var(--s6);}
.phead h1{font-size:26px;font-weight:500;letter-spacing:-.026em;margin:0;line-height:1.16;text-wrap:balance;}
.phead p{font-size:15px;color:var(--ink-2);margin:var(--s2) 0 0;max-width:56ch;font-weight:400;}
.phead .act{margin-left:auto;display:flex;gap:var(--s2);flex:none;padding-top:2px;}

.sec{margin-top:var(--s7);}
.sec:first-child{margin-top:0;}
.sech{display:flex;align-items:baseline;gap:var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--line);}
.sech h2{font-size:11px;font-weight:590;letter-spacing:.045em;text-transform:uppercase;color:var(--ink-3);margin:0;}
.sech .n{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums;}
.sech .act{margin-left:auto;font-size:12px;color:var(--ink-3);transition:color .1s;}
.sech .act:hover{color:var(--accent);}

.lede{font-size:13px;color:var(--ink-2);}
.note{font-size:12px;color:var(--ink-3);max-width:66ch;}
.mt1{margin-top:var(--s1);} .mt2{margin-top:var(--s2);} .mt3{margin-top:var(--s3);}
.mt4{margin-top:var(--s4);} .mt5{margin-top:var(--s5);} .mt6{margin-top:var(--s6);}
.rule{height:1px;background:var(--line);margin:var(--s5) 0;}
.stack{display:flex;flex-direction:column;}
.between{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);}

/* ── listes ─────────────────────────────────────────────── */
.rows{display:flex;flex-direction:column;}
.table{display:flex;flex-direction:column;}
.th,.tr{display:grid;grid-template-columns:minmax(0,1fr) 190px 170px 90px;gap:var(--s5);align-items:center;}
.th{padding:0 var(--s3) 10px;border-bottom:1px solid var(--line);
  font-size:11px;font-weight:590;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
.tr{width:100%;text-align:left;padding:var(--s4) var(--s3);border-bottom:1px solid var(--line-soft);
  border-radius:var(--r2);transition:background var(--t-fast) linear;}
.tr:hover{background:var(--tint);}
.tr:last-child{border-bottom:0;}
.td{min-width:0;}
@media (max-width:1040px){.th,.tr{grid-template-columns:minmax(0,1fr) 170px 90px;}}
.row-head{display:flex;align-items:flex-start;gap:var(--s5);}
.row-head > div{flex:1;}
.row{
  display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  min-height:40px;padding:var(--s2) var(--s2);margin:0 calc(var(--s2) * -1);
  border-radius:var(--r1);border-bottom:1px solid var(--line-soft);
  transition:background .1s linear;position:relative;
}
.rows .row:last-child{border-bottom:0;}
.row.top{align-items:flex-start;}
button.row:hover{background:var(--fill);}
button.row:active{background:var(--fill-strong);}
.rmain{display:block;min-width:0;flex:1;}
.rt{display:block;font-size:13px;font-weight:500;letter-spacing:-.008em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rs{display:block;font-size:12px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rs.wrap{white-space:normal;overflow:visible;}
.rm{font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none;}
.rm.strong{color:var(--ink);}
.rm.urgent{color:var(--alert);}
.rm.act-t{width:40px;flex:none;}
.count-big{font-size:22px;font-weight:590;letter-spacing:-.022em;line-height:1;width:38px;flex:none;text-align:right;font-variant-numeric:tabular-nums;}
.count-big.quiet{color:var(--ink-3);font-weight:500;}
.count-big.warn{color:var(--warn);}
.count-big.alert{color:var(--alert);}
.hero{padding:0 0 var(--s7);}
.hero h1{font-size:30px;font-weight:400;letter-spacing:-.028em;margin:0;line-height:1.14;}
.hero p{font-size:17px;color:var(--ink-2);margin:var(--s3) 0 0;font-weight:400;letter-spacing:-.014em;}
.sec.first{margin-top:0;}

.yous{display:flex;flex-direction:column;margin-top:var(--s2);}
.you{display:flex;align-items:baseline;gap:20px;width:100%;text-align:left;padding:14px 12px;margin:0 -12px;
  border-radius:var(--r2);transition:background var(--t-base) linear;}
.you:hover{background:var(--tint);}
.you-b{flex:1;min-width:0;}
.you-t{display:block;font-size:15px;font-weight:450;letter-spacing:-.014em;}
.you-s{display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.agent{padding:var(--s5) 0 var(--s6);}

/* ── tableau de bord ───────────────────────────────────── */
.dash-col{max-width:1180px;}
.dash-h{padding:var(--s4) 0 var(--s6);}

.working{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:500;
  letter-spacing:.02em;color:var(--accent);padding-bottom:var(--s3);}

/* l'accueil parle : Darlia est l'interlocutrice, pas la marque */

@keyframes sayin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.say-av{position:relative;width:28px;height:28px;border-radius:50%;flex:none;margin-right:2px;
  box-shadow:0 0 0 1px var(--line-soft), 0 1px 3px rgba(26,26,24,.07);}
.say-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
.say-av i{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 2px #FBFBFA;
  animation:beat 2.4s ease-in-out infinite;}
.say-b{min-width:0;}
.say-h{display:flex;align-items:center;gap:9px;padding:0 0 9px;}
.say-n{font-size:13px;font-weight:590;letter-spacing:-.008em;}
.say-role{font-size:11.5px;color:var(--ink-4);}
.say-st{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--accent);}
.say-st .pulse{width:5px;height:5px;}
/* la bande du matin : une conversation, comme un fil — Dali à gauche, vous à droite */
.say-band{display:flex;gap:var(--s6);align-items:stretch;background:#FBFBFA;
  border-radius:16px;padding:16px 26px 14px;box-shadow:0 0 0 1px var(--line-soft);overflow:hidden;}
.say-l{flex:1;min-width:0;display:flex;flex-direction:column;}
.say-l #dalithread{flex:1;display:flex;flex-direction:column;justify-content:center;}
.say-l .say-ask{margin-top:14px;}
.say-hero{flex:none;display:flex;align-items:flex-end;margin:-4px 2px -14px -6px;overflow:hidden;
  transition:width .45s var(--ease), opacity .35s linear, transform .45s var(--ease),
             margin .45s var(--ease);}
.say-hero img{width:168px;height:auto;display:block;flex:none;
  transform-origin:50% 100%;animation:dali-vit 4.8s ease-in-out infinite;}
@keyframes dali-vit{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.986)}}
.say-hero.bye{opacity:0;width:0!important;margin-right:calc(-1 * var(--s6));}
.say-hero.bye img{animation:none;}
.dali-morph{position:fixed;z-index:200;pointer-events:none;overflow:hidden;}
.dali-morph img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .22s linear;}
.dali-morph .ma{object-fit:contain;opacity:1;}
.dali-morph .mb{object-fit:cover;opacity:0;}
.dali-morph.swap .ma{opacity:0;}
.dali-morph.swap .mb{opacity:1;}
.say-pp.pose{animation:ppose .24s var(--ease);}
@keyframes ppose{0%{transform:scale(1.18)}100%{transform:scale(1)}}
.chipq:active{transform:scale(.96);}
.say-ask .field{transition:box-shadow .12s linear;}
.say-pp{width:26px;height:26px;border-radius:50%;background:var(--accent-fill);flex:none;
  box-shadow:inset 0 0 0 1px var(--accent-line);overflow:hidden;}
.say-pp img{width:100%;height:100%;object-fit:cover;display:block;}
.say-pp.rise{animation:risein .34s var(--ease);}
@media (max-width:1100px){.say-hero{display:none;}}
.say-big h1{font-size:22px;font-weight:590;letter-spacing:-.02em;line-height:1.3;margin:0;color:var(--ink);}
.say-big h1 b{font-weight:640;font-variant-numeric:tabular-nums;}
.say-big p{font-size:14px;color:var(--ink-2);margin:6px 0 0;}
.say-band.arrive{animation:sayin .5s var(--ease);}
.say-when{margin-left:auto;font-size:11.5px;color:var(--ink-4);}
.say-b{flex:1;min-width:0;}
#dalithread{display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
.say-bulle.sm{padding:14px 18px 12px;border-radius:4px 14px 14px 14px;max-width:60ch;}
.say-bulle.sm .say-rep{font-size:13.5px;line-height:1.55;}
.say-you{align-self:flex-end;margin:0;}
.say-you span{display:inline-block;background:var(--fill-strong);border-radius:16px 4px 16px 16px;
  padding:8px 14px;font-size:13px;max-width:46ch;}
/* le fil : la question part, l'ancien message balaie vers le haut, la réponse arrive */
.rise{animation:risein .34s var(--ease);}
@keyframes risein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* les bulles poussent depuis leur coin d'origine, avec un souffle élastique */
.say-you.rise{animation:none;}
.say-you.rise span{transform-origin:100% 100%;animation:qgrow .4s cubic-bezier(.3,1.25,.4,1);}
@keyframes qgrow{0%{opacity:0;transform:translateY(10px) scale(.85)}100%{opacity:1;transform:none}}
.say-bulle.rise, .tdots.rise{transform-origin:0 100%;animation:agrow .42s cubic-bezier(.32,1.2,.4,1);}
@keyframes agrow{0%{opacity:0;transform:translateY(10px) scale(.92)}70%{opacity:1;transform:translateY(-1px) scale(1.004)}100%{opacity:1;transform:none}}
.say-bulle.rise .btns{animation:risein .3s var(--ease) both;animation-delay:.15s;}
#dalithread .leave{overflow:hidden;
  transition:height .4s var(--ease), opacity .3s linear, transform .4s var(--ease);}
.say-rep{font-size:15px;line-height:1.55;color:var(--ink);margin:0;max-width:52ch;}
.tdots{display:inline-flex;gap:5px;padding:18px 20px;background:var(--accent-fill);
  border-radius:4px 16px 16px 16px;}
.tdots i{width:6px;height:6px;border-radius:50%;background:var(--accent-mark);
  animation:beat 1s ease-in-out infinite;}
.tdots i:nth-child(2){animation-delay:.16s;}
.tdots i:nth-child(3){animation-delay:.32s;}
.say-ask{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;}
.say-ask .field{flex:1;min-width:220px;height:34px;border-radius:17px;padding:0 16px;background:var(--ground);}
.chipq{flex:none;height:28px;padding:0 12px;border-radius:14px;font-size:12px;color:var(--ink-2);
  background:var(--ground);box-shadow:inset 0 0 0 1px var(--line);transition:background .1s linear;}
.chipq:hover{background:var(--fill);color:var(--ink);}
@media (max-width:1100px){.chipq{display:none;}}

/* la bulle : le message appartient à Dali, dans sa couleur */

  border-radius:4px 14px 14px 14px;padding:12px 18px 11px;max-width:56ch;
  box-shadow:0 0 0 1px rgba(47,107,76,.07);}

.say-bulle p{font-size:13.5px;color:var(--ink-2);margin:3px 0 0;line-height:1.5;}
.dash-h h1.say{max-width:none;text-wrap:balance;}
h1.say b{font-weight:640;color:var(--ink);font-variant-numeric:tabular-nums;}
.dash-h h1{font-size:27px;font-weight:400;letter-spacing:-.026em;margin:0;line-height:1.24;max-width:24ch;}
.dash-h p{font-size:15px;color:var(--ink-2);margin:10px 0 0;}


.dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}

  box-shadow:0 0 0 1px var(--line-soft);display:flex;flex-direction:column;min-width:0;}
.card-agent{grid-column:span 3;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:28px;}
.ag-l{display:flex;flex-direction:column;min-width:0;}
/* La photo appartient à la carte : bord à bord, la légende dans la lumière du bas. */
.ag-ph{position:relative;border-radius:0 14px 14px 0;overflow:hidden;background:var(--fill-strong);
  align-self:stretch;min-height:190px;margin:-24px -24px -24px 0;}

  transition:transform .6s var(--ease);}

.gwrap{position:relative;width:100%;max-width:150px;margin-top:var(--s4);}

.dtable{display:flex;flex-direction:column;margin-top:var(--s3);}

  transition:background var(--t-fast) linear;}

  .card-agent{grid-column:span 2;} .card-wide{grid-column:span 2;} .card-decide{grid-column:span 2;}
  .dth-r,.dtr{grid-template-columns:44px minmax(0,1.4fr) 150px;}}

/* ── poste de travail de l’agent ───────────────────────── */

.ac-h{display:flex;align-items:center;gap:var(--s3);}
.ac-name{font-size:11px;font-weight:590;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}

.ac-st.wait{color:var(--warn);}
.ac-st.wait .pulse{background:var(--warn-mark);}
.ac-job{display:block;width:100%;text-align:left;margin-top:var(--s4);}
.card-agent .ac-rail{margin-top:var(--s5);}
.ac-t{display:block;font-size:21px;font-weight:400;letter-spacing:-.02em;}
.ac-job:hover .ac-t{color:var(--accent);}
.ac-p{display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px;}

.ac-rail{display:grid;grid-template-columns:repeat(4,1fr);margin-top:var(--s6);position:relative;
  max-width:600px;}
.rl{position:relative;display:flex;flex-direction:column;gap:8px;}
.rl i{width:9px;height:9px;border-radius:50%;background:var(--ground);position:relative;z-index:1;
  box-shadow:inset 0 0 0 1.5px #D8D6CF;
  transition:background var(--t-slow) var(--ease),box-shadow var(--t-slow) var(--ease);}
.rl b{font-size:12.5px;font-weight:400;color:var(--ink-3);letter-spacing:-.008em;
  transition:color var(--t-slow) var(--ease);}
.rl::before{content:"";position:absolute;left:15px;right:7px;top:3.5px;height:2px;border-radius:2px;
  background:#EDEBE5;}
.rl em{font-style:normal;font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums;min-height:14px;display:block;margin-top:-3px;}
.rl:last-child::before{display:none;}
.rl.past i{background:var(--accent-mark);box-shadow:none;}
.rl.past b{color:var(--ink);}
.rl.past::before{background:var(--accent-mark);}
.rl.just::before{transform-origin:left center;animation:fillseg .55s var(--ease);}
@keyframes fillseg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rl.just i{animation:popdot .5s var(--ease);}
@keyframes popdot{0%{transform:scale(.4);opacity:.4}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.rl.just b{animation:fadein .55s var(--ease);}
@keyframes fadein{from{opacity:.3}to{opacity:1}}
.rl.now i{background:var(--accent);box-shadow:0 0 0 4px var(--accent-fill);animation:breathe 2.6s ease-in-out infinite;}
.rl.now b{color:var(--ink);font-weight:500;}
.rl.wait i{background:var(--warn-mark);box-shadow:0 0 0 4px rgba(192,160,94,.14);animation:breathe 2.6s ease-in-out infinite;}
.rl.wait b{color:var(--warn);font-weight:500;}
@keyframes breathe{0%,100%{box-shadow:0 0 0 4px var(--accent-fill)}50%{box-shadow:0 0 0 7px rgba(135,199,164,.18)}}

.ac-foot{display:flex;align-items:center;gap:var(--s4);margin-top:auto;
  padding-top:var(--s4);border-top:1px solid var(--line-soft);}
.ac-now{font-size:13px;color:var(--ink-2);flex:1;}
.ac-now::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--accent-mark);margin:0 8px 1px 0;animation:beat 2.4s ease-in-out infinite;}
.card-agent.wait .ac-now::before{background:var(--warn-mark);}
.ac-foot .btn{flex:none;}

.flux2{display:flex;flex-direction:column;gap:12px;margin-top:var(--s4);}

  color:var(--accent);font-variant-numeric:tabular-nums;}

.agent h1{font-size:34px;font-weight:400;letter-spacing:-.03em;line-height:1.14;margin:0;}

.pulse{width:6px;height:6px;border-radius:50%;background:var(--accent-mark);flex:none;animation:beat 2.4s ease-in-out infinite;}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}

.flux{display:flex;flex-direction:column;gap:var(--s5);margin-top:var(--s5);}

.foot2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s8);}

.today{font-size:36px;font-weight:400;letter-spacing:-.03em;line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums;margin-top:var(--s4);}
.today-l{font-size:13px;color:var(--ink-2);margin-top:10px;}
.spark{display:flex;align-items:flex-end;gap:3px;height:28px;margin-top:var(--s5);}

.you-tag{font-size:12px;flex:none;color:var(--warn);}

.work{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s6);padding-top:var(--s5);}

  .imp{flex-direction:column;align-items:stretch;gap:var(--s5);}.chart{width:100%;}}

.duo{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:var(--s8);margin-top:var(--s8);}
.dids{display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s4);}
.did b{font-size:24px;font-weight:400;letter-spacing:-.024em;line-height:1;}
.did span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:5px;}
@media (max-width:1080px){.duo{grid-template-columns:1fr;gap:var(--s6);}}

.att-n{font-size:26px;font-weight:590;letter-spacing:-.024em;line-height:1;width:74px;flex:none;
  font-variant-numeric:tabular-nums;}

.att-n.warn{color:var(--warn);} .att-n.alert{color:var(--alert);}

.dks>*:last-child{margin-bottom:0;}

.dk,.es{background:var(--ground);border-radius:var(--r3);box-shadow:0 0 0 1px var(--line-soft);
  padding:var(--s5) var(--s5) var(--s4);
  transition:height .21s var(--ease),opacity .15s var(--ease),transform .21s var(--ease),
             margin .21s var(--ease),padding .21s var(--ease),box-shadow .12s linear;}
.dk:hover,.es:hover{box-shadow:0 0 0 1px var(--line);}
.dk.gone,.es.gone{opacity:0;transform:translateY(-4px);overflow:hidden;
  padding-top:0;padding-bottom:0;margin-bottom:0;}
.es{border-left:2px solid var(--alert-mark);}

.dk-h{display:flex;align-items:baseline;gap:var(--s4);}
.dk-t{font-size:15px;font-weight:500;letter-spacing:-.012em;}
.dk-w{margin-left:auto;font-size:11.5px;color:var(--ink-4);flex:none;}
.dk-s{font-size:12.5px;color:var(--ink-2);margin-top:3px;}
.es-l{font-size:10.5px;font-weight:590;letter-spacing:.06em;text-transform:uppercase;color:var(--alert);}
.es .dk-t{margin-top:var(--s2);display:block;}

.reco{margin-top:var(--s4);padding-left:var(--s3);border-left:2px solid var(--accent-line);}
.reco.esc{border-left-color:#E4CFC7;}
.reco-h{display:flex;align-items:center;gap:var(--s2);padding-bottom:5px;}
.reco-l{font-size:10.5px;font-weight:590;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
.reco-v{font-size:10.5px;font-weight:640;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);}
.reco p{font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.5;max-width:64ch;}

.facts{display:flex;gap:var(--s7);margin-top:var(--s5);flex-wrap:wrap;}
.fact{display:flex;flex-direction:column;gap:3px;}
.fact b{font-size:15px;font-weight:450;letter-spacing:-.01em;}
.fact span{font-size:10.5px;font-weight:590;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);}
.fact.gap b{color:var(--warn);}

.dk-f{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s5);
  padding-top:var(--s4);border-top:1px solid var(--line-soft);}
.dk-f .after{margin-left:auto;font-size:11.5px;color:var(--ink-3);text-align:right;
  padding-left:var(--s4);}
.btn.ok{background:var(--accent-fill);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line);}
@media (max-width:900px){.dk-f{flex-wrap:wrap;} .dk-f .after{margin-left:0;text-align:left;padding-left:0;flex-basis:100%;}}

/* ── contrôles ──────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:24px;padding:0 10px;border-radius:var(--r1);font-size:12px;font-weight:500;
  color:var(--ink);background:var(--ground);box-shadow:inset 0 0 0 1px var(--line);
  transition:background .1s linear;white-space:nowrap;
}
.btn:hover{background:var(--fill);}
.btn:active{background:var(--fill-strong);}
.btn svg{width:13px;height:13px;}
.btn.key{background:var(--accent);color:#fff;box-shadow:none;font-weight:500;}
.btn.key:hover{background:#285C41;}
.btn.plain{box-shadow:none;color:var(--ink-2);}
.btn.plain:hover{background:var(--fill);color:var(--ink);}
.btn[disabled]{opacity:.4;pointer-events:none;}
.btns{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;}
.push{margin-left:auto;}

.field{width:100%;height:26px;padding:0 var(--s2);border-radius:var(--r1);background:var(--ground);
  box-shadow:inset 0 0 0 1px var(--line);font-size:13px;transition:box-shadow .1s;}
.field:focus{box-shadow:inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-fill);}
.field::placeholder{color:var(--ink-4);}

.search{position:relative;display:flex;align-items:center;max-width:300px;}
.search svg{position:absolute;left:7px;width:13px;height:13px;color:var(--ink-3);pointer-events:none;}
.search input{width:100%;height:26px;padding:0 var(--s2) 0 26px;border-radius:var(--r1);background:var(--fill);
  box-shadow:inset 0 0 0 1px transparent;font-size:13px;transition:background .1s,box-shadow .1s;}
.search input:focus{background:var(--ground);box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accent-fill);}
.search input::placeholder{color:var(--ink-4);}

.switch{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .16s var(--ease);flex:none;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(26,26,24,.25);transition:transform .16s var(--ease);}
.switch.on{background:var(--accent-mark);}
.switch.on::after{transform:translateX(12px);}

.seg{display:inline-flex;padding:1px;background:var(--fill-strong);border-radius:var(--r2);}
.seg button{height:22px;padding:0 10px;border-radius:var(--r1);font-size:12px;color:var(--ink-2);transition:color .1s;}
.seg button.on{background:var(--ground);color:var(--ink);font-weight:500;box-shadow:0 0 0 .5px rgba(26,26,24,.1);}
.segn{color:var(--ink-4);font-variant-numeric:tabular-nums;margin-left:3px;}
.row.ct{min-height:56px;}
.act-note{color:var(--ink-3);margin-top:2px;}
.vstat{text-align:right;flex:none;width:64px;}
.vstat b{display:block;font-size:13px;font-weight:500;letter-spacing:-.008em;}
.vstat span{display:block;font-size:11px;color:var(--ink-3);}

.chk{width:15px;height:15px;border-radius:var(--r1);box-shadow:inset 0 0 0 1px var(--ink-4);display:grid;place-items:center;flex:none;transition:background .12s,box-shadow .12s;}
.chk svg{width:9px;height:9px;color:#fff;opacity:0;}
.chk.on{background:var(--accent);box-shadow:none;} .chk.on svg{opacity:1;}
.rt.done{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4);}

.kbd{display:inline-flex;gap:2px;}
.kbd i{font-style:normal;font-size:11px;color:var(--ink-3);background:var(--fill);border-radius:var(--r1);padding:0 4px;line-height:16px;}

/* ── mesures ────────────────────────────────────────────── */
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5);}
.fig .v{display:block;font-size:22px;font-weight:590;letter-spacing:-.022em;font-variant-numeric:tabular-nums;line-height:1.1;}
.fig .l{display:block;font-size:12px;color:var(--ink-2);margin-top:var(--s2);}
.fig .m{display:block;font-size:11px;color:var(--ink-3);margin-top:var(--s1);line-height:1.4;}
.fig.ok .v{color:var(--accent);} .fig.alert .v{color:var(--alert);}
.meter{display:block;height:2px;background:var(--fill-strong);border-radius:99px;overflow:hidden;margin-top:var(--s2);}
.meter i{display:block;height:100%;background:var(--accent-mark);}

/* ── couples clé / valeur ───────────────────────────────── */
.kv{display:grid;grid-template-columns:150px 1fr;gap:var(--s3) var(--s4);font-size:13px;margin:0;}
.kv dt{color:var(--ink-3);} .kv dd{margin:0;} .kv dd .st{display:inline-flex;}
.lnk{color:var(--accent);}
.lnk:hover{text-decoration:underline;text-underline-offset:2px;}

/* ── citation / corps de message ────────────────────────── */
.body{font-size:13px;line-height:1.62;white-space:pre-line;color:var(--ink);max-width:64ch;}
.body.quiet{color:var(--ink-2);}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.origin{display:flex;gap:var(--s2);font-size:12px;color:var(--ink-2);}
.origin i{width:2px;border-radius:99px;background:var(--accent-mark);flex:none;}
.because{display:block;font-size:12.5px;color:var(--ink-2);padding-left:var(--s3);
  border-left:2px solid var(--accent-line);max-width:64ch;}
.row.act{padding-top:var(--s3);padding-bottom:var(--s4);}

/* ── chronologie ────────────────────────────────────────── */
.tl{display:flex;flex-direction:column;}
.tli{display:grid;grid-template-columns:64px 16px 1fr;padding-bottom:var(--s5);position:relative;}
.tli:last-child{padding-bottom:0;}
.tlt{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:1px;}
.tlr{position:relative;display:flex;justify-content:center;}
.tlr::before{content:"";position:absolute;top:11px;bottom:-11px;width:1px;background:var(--line);}
.tli:last-child .tlr::before{display:none;}
.tln{width:6px;height:6px;border-radius:50%;background:var(--line);margin-top:5px;z-index:1;}
.tln.done{background:var(--ink-4);}
.tln.now{background:var(--accent-mark);box-shadow:0 0 0 3px var(--accent-fill);}
.tlb{min-width:0;}
.tlb b{display:block;font-size:13px;font-weight:400;letter-spacing:-.008em;}
.tlb span{display:block;font-size:12px;color:var(--ink-2);margin-top:1px;}
.tlb .why{display:block;font-size:12px;color:var(--accent);margin-top:var(--s2);padding-left:var(--s3);
  border-left:2px solid var(--accent-line);}
.chainline{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12px;
  padding-bottom:var(--s4);border-bottom:1px solid var(--line-soft);}
.lk.human{color:var(--warn);font-weight:500;}
.withside{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s8);align-items:start;margin-top:var(--s7);}
.decide{background:var(--tint);border-radius:var(--r3);padding:var(--s5);
  border-left:2px solid var(--accent-mark);position:sticky;top:var(--s5);}
.decide-b{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s5);}
.btn.wide{width:100%;height:32px;font-size:13px;}
@media (max-width:1120px){.withside{grid-template-columns:1fr;gap:var(--s6);}
  .decide{position:static;}}
.decide-h{font-size:11px;font-weight:590;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}
.decide-r{font-size:19px;font-weight:400;letter-spacing:-.02em;margin-top:var(--s3);}
.decide-r b{font-weight:590;}
.decide-n{display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s5);}
.decide-n b{display:block;font-size:19px;font-weight:500;letter-spacing:-.018em;}
.decide-n span span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;}
.decide-w{font-size:12.5px;color:var(--ink-2);margin:var(--s4) 0 0;max-width:60ch;}
@media (max-width:900px){.decide-n{flex-wrap:wrap;gap:var(--s4) var(--s5);}}
.lk{color:var(--ink-4);}
.lk.past{color:var(--ink-3);}
.lk.now{color:var(--accent);font-weight:500;}
.lksep{color:var(--ink-4);font-size:11px;}
.tli.wait .tlb b{color:var(--ink-3);}

/* ── enchaînement d'automatisation ──────────────────────── */
.flow{display:flex;flex-direction:column;max-width:440px;}
.proc{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:var(--s8);align-items:start;}
.proc-side{display:flex;flex-direction:column;gap:var(--s5);padding-top:var(--s2);}
.ps b{display:block;font-size:24px;font-weight:400;letter-spacing:-.024em;line-height:1;}
.ps b.num{font-variant-numeric:tabular-nums;}
.ps span{display:block;font-size:12px;color:var(--ink-3);margin-top:5px;}
.proc-side .ps:first-child b{color:var(--accent);}
@media (max-width:1080px){.proc{grid-template-columns:1fr;gap:var(--s6);}
  .proc-side{flex-direction:row;gap:var(--s7);}}
.step{display:grid;grid-template-columns:28px 1fr;align-items:baseline;padding:var(--s3) 0;border-bottom:1px solid var(--line-soft);}
.step:last-child{border-bottom:0;}
.step .i{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums;}
.step b{display:block;font-size:13px;font-weight:400;}
.step span{display:block;font-size:12px;color:var(--ink-2);margin-top:1px;}
.step.act b{color:var(--accent);font-weight:500;}
.step.hum{border-left:2px solid var(--line);padding-left:var(--s3);margin-left:calc(var(--s3) * -1 + 2px);}
.step.hum b{color:var(--ink-2);}

/* ── boîte de réception ─────────────────────────────────── */
.inbox{display:grid;grid-template-columns:206px 312px 1fr;flex:1;min-height:0;overflow:hidden;}
.folders{background:var(--fill);border-right:1px solid var(--line-soft);padding:var(--s3) var(--s2);display:flex;flex-direction:column;gap:1px;min-height:0;}
.mlist{border-right:1px solid var(--line-soft);display:flex;flex-direction:column;min-width:0;min-height:0;}
.mlist-h{height:32px;flex:none;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4);border-bottom:1px solid var(--line-soft);}
.mlist-h b{font-size:11px;font-weight:590;letter-spacing:.045em;text-transform:uppercase;color:var(--ink-3);}
.mlist-h .n{margin-left:auto;font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums;}
.msg{display:block;width:100%;text-align:left;padding:10px var(--s4) 11px;border-bottom:1px solid var(--line-soft);position:relative;transition:background .1s linear;}
.msg:hover{background:var(--fill);}
.msg.on{background:var(--sel);}
.msg.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent-mark);}
.msg-h{display:flex;align-items:baseline;gap:var(--s2);}
.msg-f{font-size:13px;font-weight:590;letter-spacing:-.008em;}
.msg-t{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;}
.msg-s{display:block;font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-p{display:block;font-size:12px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-m{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2);font-size:11px;color:var(--ink-3);}
.unread{width:6px;height:6px;border-radius:50%;background:var(--accent-mark);flex:none;}
.detail{display:flex;flex-direction:column;min-width:0;min-height:0;}

/* état de la demande — un point, un verbe, l'heure */
.msg-st{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--ink-2);}
.msg-st i{width:5px;height:5px;border-radius:50%;background:var(--accent-mark);flex:none;}
.msg-st.warn{color:var(--warn);} .msg-st.warn i{background:var(--warn-mark);}
.msg-st.alert{color:var(--alert);} .msg-st.alert i{background:var(--alert-mark);}
.msg-st.okm{color:var(--ink-3);} .msg-st.okm i{opacity:.5;}
.msg-st em{font-style:normal;margin-left:auto;font-size:11px;color:var(--ink-4);flex:none;}

/* la carte Dali travaille — calquée sur la proposition de Dali */
.agv{position:relative;grid-column:span 3;border-radius:16px;overflow:hidden;min-height:352px;
  display:flex;flex-direction:column;justify-content:space-between;padding:20px 26px 20px;
  cursor:pointer;box-shadow:0 0 0 1px var(--line-soft);text-align:left;}
.agv-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .8s var(--ease);}
.agv:hover .agv-bg{transform:scale(1.03);}
.agv-shade{position:absolute;inset:0;
  background:linear-gradient(to top, rgba(10,12,10,.86), rgba(10,12,10,.34) 48%, rgba(10,12,10,.42));}
.agv-top,.agv-rail,.agv-bot{position:relative;z-index:1;}
.agv-top{display:flex;align-items:center;gap:10px;}
.agv-l{font-size:11.5px;font-weight:640;letter-spacing:.09em;text-transform:uppercase;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);}
.agv-spin{margin-left:auto;width:16px;height:16px;border-radius:50%;flex:none;
  border:2.5px dashed rgba(255,255,255,.9);animation:agspin 3.6s linear infinite;}
@keyframes agspin{to{transform:rotate(360deg)}}
.agv-chip{display:flex;align-items:center;height:26px;padding:0 13px;border-radius:13px;
  background:rgba(238,245,241,.95);color:var(--accent);font-size:12.5px;font-weight:590;}
.agv.wait .agv-chip{background:rgba(248,238,214,.96);color:#7A5E24;}
.agv.wait .agv-spin{border-color:rgba(240,217,168,.9);}

/* le rail : une barre continue qui traverse les pastilles */
.agv-rail{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0 4px;}
.agv-track,.agv-prog{position:absolute;top:13px;left:12.5%;right:12.5%;height:6px;border-radius:3px;
  background:rgba(255,255,255,.55);}
.agv-prog{right:auto;width:0;background:var(--accent);
  box-shadow:0 1px 3px rgba(0,0,0,.18);transition:width .5s var(--ease);}
.agr{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;}
.agr i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;z-index:1;
  transition:box-shadow var(--t-slow) var(--ease),background var(--t-slow) var(--ease);}
.agr i svg{width:15px;height:15px;stroke:#fff;}
.agr.past i{background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.22);}
.agr.now i,.agr.hold i{width:36px;height:36px;margin:-3px 0;background:var(--accent);
  box-shadow:inset 0 0 0 4.5px #fff, 0 0 0 7px rgba(255,255,255,.22), 0 0 18px rgba(255,255,255,.35);}
.agr.hold i{background:var(--warn-mark);
  box-shadow:inset 0 0 0 4.5px #fff, 0 0 0 7px rgba(192,160,94,.25), 0 0 18px rgba(192,160,94,.35);}
.agr.next i{width:26px;height:26px;margin:2px 0;background:#E6E4DD;
  box-shadow:0 1px 3px rgba(0,0,0,.15);}
.agr b{font-size:14.5px;font-weight:590;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);
  letter-spacing:-.01em;white-space:nowrap;}
/* passage d'étape : la barre coule d'abord, la pastille s'allume ensuite */
.agv-prog{transition:width .55s cubic-bezier(.4,.2,.2,1);}
.stepping .agr.fresh i{animation:dotin .3s var(--ease) .4s backwards;}
.stepping .agr.fresh i svg path{stroke-dasharray:22;stroke-dashoffset:22;animation:chkdraw .34s ease-out .55s forwards;}
.stepping .agr.now i,.stepping .agr.hold i{animation:ringin .34s var(--ease) .5s backwards;}
@keyframes dotin{from{transform:scale(.55)}to{transform:scale(1)}}
@keyframes chkdraw{to{stroke-dashoffset:0}}
@keyframes ringin{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.agr.next b{color:rgba(255,255,255,.85);}

.agv-bot{display:flex;align-items:flex-end;gap:var(--s4);}
.agv.jobin .agv-bg,.agv.jobin .agv-top,.agv.jobin .agv-rail,.agv.jobin .agv-bot{animation:fadein .5s var(--ease) backwards;}
.agv .btn.key{height:34px;padding:0 18px;border-radius:17px;background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#1F5138;
  font-size:13.5px;font-weight:600;letter-spacing:-.006em;
  box-shadow:0 1px 2px rgba(8,10,8,.22), 0 6px 18px rgba(8,10,8,.24);}
.agv .btn.key:hover{background:#fff;box-shadow:0 1px 2px rgba(8,10,8,.26), 0 8px 22px rgba(8,10,8,.3);}
.agv .btn.key:active{background:rgba(255,255,255,.88);}
.agv-bt{flex:1;min-width:0;}
.agv-bt b{display:block;font-size:20px;font-weight:590;letter-spacing:-.016em;color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.5);}
.agv-bt span{display:block;font-size:12.5px;color:rgba(255,255,255,.9);margin-top:3px;
  text-shadow:0 1px 3px rgba(0,0,0,.5);}
.agv-bt em{display:flex;align-items:center;gap:8px;font-style:normal;font-size:13px;
  color:#fff;margin-top:10px;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.agv-bt em i{width:5px;height:5px;border-radius:50%;background:var(--accent-mark);flex:none;
  animation:beat 2.4s ease-in-out infinite;}
.agv.wait .agv-bt em i{background:var(--warn-mark);}
.agv-bot .btn{flex:none;}
@media (max-width:880px){.agr b{font-size:12px;}}

/* processus — le langage des cartes de Loyers, le rail de l'accueil */
.pstack{display:flex;flex-direction:column;gap:14px;margin-top:var(--s2);}

.prx2{text-align:left;display:block;transition:box-shadow .12s linear;}
.prx2:hover{box-shadow:0 0 0 1px var(--line);}
.prx2.wait{border-left:2px solid var(--warn-mark);}
.prx2-b{display:flex;align-items:flex-end;gap:var(--s7);margin-top:var(--s4);}
.prx2-l{min-width:0;flex:1;}
.prx2-l b{display:block;font-size:17px;font-weight:500;letter-spacing:-.016em;}
.prx2-l span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;}

function askDali(q){
  q = (q||'').trim();
  if(!q) return;
  const norm = q.toLowerCase();
  const hitqa = DALI_QA.find(x=>x.k.some(k=>norm.includes(k)));
  const rep = hitqa || {a:'Je m’en occupe — je rassemble les éléments et je vous réponds dans le fil d’Activité.',
    act:{label:'Voir l’activité', attr:'data-view="activite"'}};
  state.daliChat = {q, a:rep.a, act:rep.act, fresh:true};
  const th = $('#dalithread');
  if(!th){ render(); return; }
  const st = $('.say-st'); if(st) st.innerHTML = '<span class="pulse"></span>Écrit…';

  /* un seul geste : la grande Dali se réduit et s'arrondit
     jusqu'à devenir sa photo de profil. */
  const hero = $('.say-hero');
  if(hero && !hero.classList.contains('bye')){
    const heroImg = hero.querySelector('img');
    const from = heroImg.getBoundingClientRect();

    let pp = $('.say-pp');
    if(!pp){
      pp = document.createElement('span');
      pp.className = 'say-pp';
      pp.style.opacity = '0';
      pp.innerHTML = `<img src="${MASCOT_PFP}" alt="Dali">`;
      const hh = $('.say-h');
      if(hh) hh.insertBefore(pp, hh.firstChild);
    }

    /* la position FINALE de la photo, mesurée d'avance sans rien montrer */
    hero.style.transition = 'none';
    hero.classList.add('bye');
    const to = pp.getBoundingClientRect();
    hero.classList.remove('bye');
    hero.getBoundingClientRect();
    hero.style.transition = '';

    /* le médaillon : l'illustration dedans, le portrait en attente */
    const s0 = Math.max(from.width, from.height);
    const box = document.createElement('div');
    box.className = 'dali-morph';
    box.style.left = (from.left + from.width/2 - s0/2) + 'px';
    box.style.top  = (from.top + from.height/2 - s0/2) + 'px';
    box.style.width = box.style.height = s0 + 'px';
    box.innerHTML = `<img class="ma" src="${MASCOT_HERO}" alt=""><img class="mb" src="${MASCOT_PFP}" alt="">`;
    document.body.appendChild(box);

    /* l'espace se referme pendant le geste */
    hero.style.visibility = 'hidden';
    hero.style.width = hero.offsetWidth + 'px';
    hero.getBoundingClientRect();
    hero.classList.add('bye');

    box.animate([
      { left: box.style.left, top: box.style.top, width: s0+'px', height: s0+'px',
        borderRadius: '26px', backgroundColor: 'rgba(238,245,241,0)' },
      { left: to.left+'px', top: to.top+'px', width: to.width+'px', height: to.height+'px',
        borderRadius: '50%', backgroundColor: 'rgba(238,245,241,1)' }
    ], { duration: 520, easing: 'cubic-bezier(.4,.7,.25,1)', fill: 'forwards' });
    setTimeout(()=>box.classList.add('swap'), 180);
    setTimeout(()=>{
      box.remove();
      pp.style.opacity = '';
      pp.classList.add('pose');
    }, 530);
  }

  /* 1 — votre question arrive par le bas */
  const you = document.createElement('div');
  you.className = 'say-you rise';
  you.innerHTML = `<span></span>`;
  you.firstChild.textContent = q;
  const olds = [...th.children];
  th.appendChild(you);

  /* 2 — l'ancien message balaie vers le haut, la question glisse à sa place */
  olds.forEach(el=>{
    el.style.height = el.offsetHeight + 'px';
    el.getBoundingClientRect();
    el.classList.add('leave');
    requestAnimationFrame(()=>{
      el.style.height = '0px';
      el.style.opacity = '0';
      el.style.transform = 'translateY(-28px)';
    });
  });

  setTimeout(()=>{
    olds.forEach(el=>el.remove());
    /* 3 — Dali écrit */
    const dots = document.createElement('span');
    dots.className = 'tdots rise';
    dots.innerHTML = '<i></i><i></i><i></i>';
    th.appendChild(dots);
    /* 4 — la réponse prend la place */
    setTimeout(render, 950);
  }, 400);
}

/* Un tick de simulation ne recharge plus la page : la carte est patchée en place. */
function patchAgentCard(){
  if(state.view !== 'accueil' || state.editing) return;
  const card = $('.agv');
  if(!card){ liveRender(); return; }
  const jobNow = state.agentJob, stepNow = state.agentStep;
  const stepping = viewAccueil._job === jobNow && viewAccueil._k !== undefined
    && stepNow === viewAccueil._k + 1;
  const prevStep = stepping ? viewAccueil._k : stepNow;
  viewAccueil._k = stepNow; viewAccueil._job = jobNow;
  const j = AGENT_JOBS[jobNow];
  const tmp = document.createElement('div');
  tmp.innerHTML = agvCardHTML(stepping, prevStep);
  const fresh = tmp.firstElementChild;
  if(card.dataset.case === j.case){
    /* même dossier : la photo et son voile restent intacts, zéro scintillement */
    card.className = fresh.className;
    ['.agv-top','.agv-rail','.agv-bot'].forEach(sel=>{
      const a = card.querySelector(sel), b = fresh.querySelector(sel);
      if(a && b) a.replaceWith(b);
    });
  } else {
    fresh.classList.add('jobin');
    card.replaceWith(fresh);
  }
  if(stepping) setTimeout(()=>{
    const prog = $('.agv-prog');
    if(prog){
      prog.getBoundingClientRect();
      prog.style.width = Math.round(stepNow/(j.steps.length-1)*75) + '%';
    }
  }, 30);
}

/* L'état d'une demande, vu du côté de Darlia. */
const msgState = m =>
  m.escalated ? (state.approved[m.id] ? ['okm','Courrier envoyé par vous'] : ['alert','Darlia vous sollicite']) :
  (m.needsApproval && !state.approved[m.id]) ? ['warn','Votre décision est nécessaire'] :
  m.handled ? ['okm','Darlia a traité'] :
  state.approved[m.id] ? ['','Darlia s’en occupe'] :
  m.ai ? ['','Darlia s’en occupe'] :
  ['','Darlia analyse la demande…'];

/* Le fil de travail ; votre décision le prolonge au lieu de l'effacer. */
function workOf(m){
  const base = m.work || [['', m.ai ? 'Darlia s’en occupe' : 'Darlia analyse la demande…', 'now']];
  if(m.escalated && state.approved[m.id])
    return base.concat([['à l’instant','Courrier de réponse envoyé par Sophie Martin']]);
  if(m.needsApproval && state.approved[m.id]){
    return base.filter(w=>w[2]!=='wait').concat([[ 'à l’instant',
      state.refused && state.refused[m.id]
        ? 'Refus enregistré — Darlia n’exécutera pas cette action'
        : 'Votre accord reçu — Darlia a repris le traitement']]);
  }
  return base;
}

    const acts = [];
    msgs.forEach(m=>{
      acts.push({d:m.day, h:m.time, a:'Darlia a analysé une demande', s:`${m.subject} · ${m.prop}`});
      if(m.reply && !m.needsApproval) acts.push({d:m.day, h:m.time, a:'Darlia a répondu au locataire', s:'Sans votre intervention'});
    });
    cases.forEach(c=>c.steps.filter(x=>x.state==='done').slice(-2).forEach(x=>
      acts.push({d:'', h:x.t, a:x.title, s:`${c.title} · ${c.prop}`})));
    return {
      nom:t.name, meta:`Locataire · ${t.lot} · ${t.prop}`, av:initials(t.name),
      tone:t.status==='À jour'?'ok':'warn', etat:t.status==='À jour'?'Loyer à jour':'Relance en cours',
      nums:[[cases.length,'demandes prises en charge'],[msgs.length,'messages traités'],[(DOCS[t.id]||[]).length,'pièces au dossier']],
      phrase:`Darlia répond seule aux demandes courantes de ${t.name.split(' ')[0]}, missionne les prestataires du ${t.prop} et ne vous sollicite qu’au-delà de votre seuil.`,
      peut:['Répondre aux demandes courantes','Missionner un prestataire référencé','Relancer une pièce manquante','Envoyer la quittance mensuelle'],
      acts:acts.slice(0,4),
      dossiers:cases.map(c=>({t:c.title, p:c.prop, st:c.status, id:c.id, pid:pr?pr.id:null})),
      open:`data-tenant="${t.id}"`, act:`<button class="btn" data-toast="Message ouvert en rédaction">Écrire</button>`};
  }

  if(kind==='o'){
    const o = OWNERS.find(x=>x.id===id); if(!o) return null;
    const biens = PROPS.filter(x=>x.owner===o.name);
    const cases = CASES.filter(c=>biens.some(b=>b.addr===c.prop));
    return {
      nom:o.name, meta:`Propriétaire · ${biens.length} bien${biens.length>1?'s':''} · ${o.lots} lots`,
      av:initials(o.name.replace('SCI ','')), tone:'warn', etat:'Rapport d’août à relire',
      nums:[[biens.length,'biens suivis'],[o.lots,'lots en gestion'],[cases.length,'interventions coordonnées']],
      phrase:`Darlia prépare le rapport de ${o.name} chaque mois et vous le soumet avant envoi. Toute dépense supérieure à 300 € TTC lui est présentée pour accord.`,
      peut:['Préparer le rapport mensuel','Soumettre un devis à son accord','L’informer d’un sinistre','Archiver les pièces du mandat'],
      acts:[{d:'Hier', h:'18:40', a:'Darlia a préparé le rapport mensuel', s:'En attente de votre relecture'},
            {d:'5 août', h:'', a:'Darlia a envoyé le rapport de juillet', s:'Après votre accord'},
            {d:'4 juillet', h:'', a:'Darlia a envoyé le rapport de juin', s:'Après votre accord'}],
      dossiers:cases.slice(0,3).map(c=>({t:c.title, p:c.prop, st:c.status, id:c.id,
        pid:(PROPS.find(x=>x.addr===c.prop)||{}).id})),
      open:`data-owner="${o.id}"`, act:`<button class="btn" data-toast="Rapport ouvert">Dernier rapport</button>`};
  }

  const v = VENDORS.find(x=>x.id===id); if(!v) return null;
  const neuf = !(v.last && v.last.length);
  const dispo = v.rate>=90;
  return {
    nom:v.name, meta:`${v.trade} · ${v.zone}`, av:null, icon:tradeIcon(v.trade),
    tone:neuf?'':dispo?'ok':v.rate>=75?'warn':'alert',
    etat:neuf?'Jamais missionné':dispo?'Disponible':v.rate>=75?'Délais variables':'Délais irréguliers',
    nums:neuf?[[0,'mission confiée'],['—','délai moyen'],['—','réponses sous 24 h']]
      :[[v.jobs,'missions confiées'],[v.delay,'délai moyen'],[v.rate+' %','réponses sous 24 h']],
    phrase:`Darlia sollicite automatiquement ce prestataire lorsqu’une intervention correspond à son secteur et à son domaine.`,
    peut:['Demander un devis','Planifier une intervention','Relancer sans réponse','Suivre la réponse','Classer l’intervention au dossier'],
    acts:neuf?[{d:'Aujourd’hui', h:'', a:'Contact ajouté par Sophie Martin', s:'Darlia complètera la fiche au fil des échanges'}]
      :[{d:'Aujourd’hui', h:'09:42', a:'Darlia a demandé une intervention', s:`${v.last[0][0]} · ${v.last[0][1]}`},
          {d:'Hier', h:'16:18', a:'Darlia a relancé le prestataire', s:`Sans réponse après ${v.delay}`},
          ...v.last.slice(1).map(j=>({d:'12 août', h:'', a:'Darlia a planifié une intervention', s:`${j[0]} · ${j[1]}`}))].slice(0,4),
    dossiers:(v.last||[]).map(j=>({t:j[0], p:j[1], st:j[2],
      pid:(PROPS.find(x=>x.addr===j[1])||{}).id,
      id:(CASES.find(c=>c.title===j[0])||{}).id})),
    open:`data-vendor="${v.id}"`, act:`<button class="btn" data-toast="Demande d’intervention préparée par Darlia">Missionner</button>`};
}

function darliaOn(p){
  const cases = CASES.filter(c=>c.prop===p.addr);
  const open = cases.filter(c=>c.status!=='Clôturé');
  const tens = TENANTS.filter(t=>t.prop===p.addr);
  const docs = (p.kind==='immeuble'?PROP_DOCS.common:PROP_DOCS.lot);
  const next = open.find(c=>c.next) || cases[0];
  const acts = [];
  cases.forEach(c=>c.steps.filter(st=>st.state==='done').forEach(st=>
    acts.push({t:st.t, title:st.title, sub:c.title})));
  return {cases, open, tens, docs, next, acts:acts.slice(-3).reverse()};
}

const eur = n => n.toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ') + ' €';
const num = t => { const m = String(t).match(/\d[\d\s\u202f\u00a0]*/); return m ? parseInt(m[0].replace(/\D/g,''), 10) : 0; };

/* Les totaux viennent des biens ; RENTS ne liste que les exceptions
   et les mouvements notables — le reste du parc est encaissé sans bruit. */
function rentTotals(){
  const potentiel = PROPS.reduce((a,p)=>a+num(p.rent), 0);
  const vacants = RENTS.filter(r=>r.state==='vacant').reduce((a,r)=>a+num(r.due), 0);
  const du = potentiel - vacants;
  let reste = 0;
  RENTS.forEach(r=>{
    if(r.state==='retard') reste += num(r.due);
    if(r.state==='partiel') reste += num(r.due) - num(r.when);
  });
  const recu = du - reste;
  const lots = PROPS.reduce((a,p)=>a+p.lots, 0);
  const nvac = RENTS.filter(r=>r.state==='vacant').length;
  const baux = lots - nvac;
  return {du, recu, reste, pct: Math.round(recu / du * 100),
    lots, baux, nvac,
    npart: RENTS.filter(r=>r.state==='partiel').length,
    nret: RENTS.filter(r=>r.state==='retard').length};
}

/* La même arithmétique, vue d'un seul bien. */
function rentByProp(p){
  const rows = RENTS.filter(r=>r.prop===p.addr);
  const vac = rows.filter(r=>r.state==='vacant');
  const called = num(p.rent) - vac.reduce((a,r)=>a+num(r.due), 0);
  let out = 0, flag = null, tone = 'ok';
  rows.forEach(r=>{
    if(r.state==='retard'){ out += num(r.due); flag = `${r.tenant} — retard de ${r.days} j`; tone = 'alert'; }
    if(r.state==='partiel'){ out += num(r.due) - num(r.when); flag = `${r.tenant} — paiement partiel`; tone = 'warn'; }
  });
  if(vac.length && !flag){ flag = vac[0].action; tone = 'off'; }
  return {called, got: called - out, out, vac: vac.length, flag, tone,
    action: (rows.find(r=>r.action)||{}).action || null};
}

function attention(){
  const vals = pendingApprovals();
  const escs = MESSAGES.filter(m=>m.escalated && !state.approved[m.id]);
  const urgs = state.tasks.filter(t=>!t.done && t.prio==='clay');
  return {vals, escs, urgs, total: vals.length + escs.length + urgs.length};
}

/* Volume reçu ce matin ; ce que Darlia n'a pas absorbé remonte ici. */
const RECU_MATIN = 18;
const traiteSeule = () => Math.max(0, RECU_MATIN - attention().total);

/* Une décision : le titre, l'avis de Darlia, les chiffres qui tranchent,
   puis ce qui se passe une fois qu'on a décidé. */
function decisionCard(d){
  return `<article class="dk">
    <div class="dk-h"><span class="dk-t">${esc(d.title)}</span><span class="dk-w">${esc(d.when)}</span></div>
    ${d.sub?`<div class="dk-s">${esc(d.sub)}</div>`:''}
    ${d.why?`<div class="reco">
      ${d.reco?`<div class="reco-h"><span class="reco-l">Darlia recommande</span><span class="reco-v">${esc(d.reco)}</span></div>`:''}
      <p>${esc(d.why)}</p></div>`:''}
    ${d.facts&&d.facts.length?`<div class="facts">${d.facts.map(f=>
      `<span class="fact ${f[2]||''}"><b class="num">${esc(f[1])}</b><span>${esc(f[0])}</span></span>`).join('')}</div>`:''}
    <div class="dk-f">${d.actions}${d.after?`<span class="after">${esc(d.after)}</span>`:''}</div>
  </article>`;
}

function viewAtraiter(){
  const {vals, escs, urgs, total} = attention();
  if(!total) return `<div class="page scroll enter"><div class="col val-col">
    <div class="vhead">
      <div class="working"><span class="pulse"></span>Darlia travaille actuellement</div>
      <h1>Aucune décision ne vous attend.</h1>
      <p>Darlia a traité les demandes du jour dans les limites que vous avez fixées.</p>
      <p class="quiet">Ce matin · ${RECU_MATIN} demandes traitées par Darlia sans intervention</p>
    </div>
  </div></div>`;

  /* validations en attente */
  const decisions = vals.map(a=>decisionCard({
    title:a.title,
    sub:[a.prop, a.sub].filter(Boolean).join(' · '),
    when:a.when, why:a.why, reco:a.reco, facts:a.facts, after:a.after,
    actions:`<button class="btn key" data-approve="${a.id}">Approuver</button>
      <button class="btn plain" data-approval="${a.id}">Voir le détail</button>
      <button class="btn plain" data-refuse="${a.id}">Refuser</button>`
  }));

  /* décisions qui vous ont été confiées directement */
  urgs.forEach(t=>decisions.push(decisionCard({
    title:t.t, sub:t.s, when:t.when, why:t.why, after:t.after,
    actions:`${t.go?`<button class="btn key" data-case="${t.go[1]}">Ouvrir le dossier</button>`:''}
      <button class="btn plain" data-task="${t.id}">Marquer comme faite</button>`
  })));

  const escalades = escs.map(m=>`<article class="es">
    <div class="dk-h"><span class="es-l">Darlia vous sollicite</span>
      <span class="dk-w">${esc(m.day === m.time ? m.day : m.day + ' ' + m.time)}</span></div>
    <span class="dk-t">${esc(m.subject)}</span>
    <div class="dk-s">${esc(m.from)}<span class="sep">·</span>${esc(m.prop)}</div>
    <div class="reco esc"><p>Cette demande nécessite une intervention humaine. Darlia ne traite pas les actes juridiques.</p></div>
    <div class="dk-f">
      <button class="btn" data-msg="${m.id}" data-view="inbox" data-folder="f-esc">Prendre en charge</button>
      <button class="btn plain" data-courrier="${m.id}">Voir le projet de réponse</button>
      <span class="after">Darlia a préparé un projet de courrier pour vous.</span>
    </div>
  </article>`);

  const d = decisions.length;
  const titre = d === 0 ? 'Aucune décision ne vous attend.'
              : d === 1 ? 'Darlia a besoin de vous pour une\u00a0décision.'
              : `Darlia a besoin de vous pour ${d}\u00a0décisions.`;

  return `<div class="page scroll enter"><div class="col val-col">
    <div class="vhead">
      <div class="working"><span class="pulse"></span>Darlia travaille actuellement</div>
      <h1>${titre}</h1>
      <p>Le reste a déjà été traité automatiquement.</p>
      <p class="quiet">Ce matin · ${traiteSeule()} demandes traitées par Darlia sans intervention</p>
    </div>
    ${d?`<section class="sec" style="margin-top:0">${sech('Décisions requises', d)}
      <div class="dks">${decisions.join('')}</div></section>`:''}
    ${escalades.length?`<section class="sec">${sech('Escalades', escalades.length)}
      <div class="dks">${escalades.join('')}</div></section>`:''}
    <p class="note mt6">Les limites au-delà desquelles Darlia vous sollicite se règlent dans Automatisations.</p>
  </div></div>`;
}

function toast(msg, action){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i></i><span>${esc(msg)}</span>` +
    (action?`<button class="act">${esc(action.label)}</button>`:'');
  if(action) el.querySelector('.act').addEventListener('click', ()=>{ el.remove(); action.run(); });
  $('#toasts').appendChild(el);
  const life = action ? 6000 : 2600;
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 300); }, life);
}

/* ── couches modales : focus piégé puis restitué ── */
let lastFocus = null;
function openScrim(sel){
  lastFocus = document.activeElement;
  const el = $(sel);
  el.classList.add('open');
  const f = el.querySelector('button,input,[tabindex]:not([tabindex="-1"])');
  if(f) setTimeout(()=>f.focus(), 40);
}
function closeScrim(sel){
  const el = $(sel);
  if(!el.classList.contains('open')) return;
  el.classList.remove('open');
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}
function trapFocus(e){
  const open = document.querySelector('.scrim.open');
  if(!open || e.key!=='Tab') return;
  const items = [...open.querySelectorAll('button:not([disabled]),input,[tabindex]:not([tabindex="-1"])')]
    .filter(n=>n.offsetParent!==null);
  if(!items.length) return;
  const first = items[0], last = items[items.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}
